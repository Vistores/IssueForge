<div class="app-shell" [class.access-shell]="isAccessRoute">
  @if (!isAccessRoute) {
  <aside class="sidebar">
    <a class="brand" routerLink="/">
        <span class="brand-mark">IF</span>
        <span>
          <strong>IssueForge</strong>
        <small>Issue workspace</small>
        </span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/issues" routerLinkActive="active">Issues</a>
      <a routerLink="/teams" routerLinkActive="active">Teams</a>
      <a routerLink="/stats" routerLinkActive="active">Stats</a>
      <a routerLink="/activity" routerLinkActive="active">Logs</a>
      <a routerLink="/account" routerLinkActive="active">Account</a>
    </nav>

    <div class="sidebar-note">
      <span>Portfolio stack</span>
      <strong>Angular + ASP.NET + SQLite</strong>
    </div>
  </aside>
  }

  <main class="content">
    <div class="content-inner">
      <router-outlet />
    </div>
  </main>

  <div class="toast-stack">
    @for (message of toast.messages$ | async; track message.id) {
      <button class="toast toast-{{ message.type }}" type="button" (click)="toast.dismiss(message.id)">
        {{ message.text }}
      </button>
    }
  </div>
</div>
