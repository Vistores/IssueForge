<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">GI</span>
      <span>
        <strong>GameIssueTracker</strong>
        <small>Quest board</small>
      </span>
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      <a routerLink="/issues" routerLinkActive="active">Issues</a>
    </nav>

    <div class="sidebar-note">
      <span>Guild ledger</span>
      <strong>Angular + ASP.NET + SQLite</strong>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>

  <div class="toast-stack">
    @for (message of toast.messages$ | async; track message.id) {
      <button class="toast toast-{{ message.type }}" type="button" (click)="toast.dismiss(message.id)">
        {{ message.text }}
      </button>
    }
  </div>
</div>
